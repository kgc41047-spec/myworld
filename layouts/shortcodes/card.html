<style>
  /* 为了方便，我们将样式直接写在这里。
     如果你有自定义 CSS 文件，也可以把这部分移过去。 */
  .card-details {
    background-color: #ffffff; /* 白色背景 */
    border: 1px solid #e0e0e0; /* 淡淡的边框 */
    border-radius: 8px;        /* 圆角 */
    box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* 轻微的阴影，营造卡片感 */
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .card-summary {
    padding: 12px 16px;
    font-weight: bold;
    cursor: pointer;
    background-color: #fff;
    list-style: none; /* 隐藏默认的小三角 (兼容部分浏览器) */
    display: flex;    /* 使用 Flex 布局 */
    justify-content: space-between;
    align-items: center;
  }

  /* 隐藏 Chrome/Safari 默认的小三角 */
  .card-summary::-webkit-details-marker {
    display: none;
  }

  /* 自定义一个小箭头 */
  .card-summary::after {
    content: '+'; 
    font-size: 1.2rem;
    color: #888;
    transition: transform 0.2s;
  }

  /* 打开时的状态：背景变一点色，箭头旋转 */
  .card-details[open] .card-summary {
    border-bottom: 1px solid #eee;
    background-color: #fafafa;
  }
  
  .card-details[open] .card-summary::after {
    transform: rotate(45deg); /* 让加号变成叉号，或者旋转箭头 */
  }

  .card-content {
    padding: 16px;
    background-color: #fff;
    color: #333;
  }
</style>

<details class="card-details">
  <summary class="card-summary">
    {{ .Get "title" }}
  </summary>
  <div class="card-content">
    {{ .Inner | markdownify }}
  </div>
</details>
