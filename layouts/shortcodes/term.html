<style>
  /* 词条本身的样式：加个虚线下划线提示用户可以交互 */
  .wiki-term {
    color: #2c3e50; /* 深蓝色 */
    text-decoration: none;
    border-bottom: 1px solid #ccc; /* 虚线 */
    position: relative; /* 关键：为了让提示框相对于词条定位 */
    cursor: help; /* 鼠标放上去变成问号，提示是解释 */
    transition: color 0.2s;
  }

  .wiki-term:hover {
    color: #007bff; /* 悬停变色 */
    border-bottom-color: #007bff;
  }

  /* 提示框的容器 */
  .term-tooltip {
    visibility: hidden; /* 默认隐藏 */
    width: 240px;       /* 卡片宽度 */
    background-color: #fff;
    color: #333;
    text-align: left;
    border-radius: 6px;
    padding: 12px;
    
    /* 定位逻辑：悬浮在词条正上方 */
    position: absolute;
    z-index: 100;
    bottom: 125%; /* 位于文字上方 */
    left: 50%;
    margin-left: -120px; /* 居中 (宽度的一半) */

    /* 卡片阴影和边框 */
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border: 1px solid #eee;
    font-size: 0.9rem;
    line-height: 1.5;
    
    /* 动画效果 */
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none; /* 防止鼠标误触碰到提示框本身 */
  }

  /* 一个小的三角形箭头，指向词条 */
  .term-tooltip::after {
    content: "";
    position: absolute;
    top: 100%; /* 在提示框底部 */
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #fff transparent transparent transparent;
  }

  /* 鼠标悬停时显示提示框 */
  .wiki-term:hover .term-tooltip {
    visibility: visible;
    opacity: 1;
  }
</style>

<a href="{{ .Get "url" }}" class="wiki-term">
  {{ .Get "word" }}
  <span class="term-tooltip">
    <strong>{{ .Get "word" }}</strong><br>
    <span style="color:#666; font-size:0.85rem;">
      {{ .Get "tip" }}
    </span>
  </span>
</a>
